# Masamadre Films - editor de proyectos (Decap CMS)
# Editor settings. Repository: jgarridorepate-bit/masamadre-films

backend:
  name: github
  repo: jgarridorepate-bit/masamadre-films
  branch: main
  commit_messages:
    update: "Proyectos actualizados"

locale: es
site_url: https://masamadrefilms.com
display_url: https://masamadrefilms.com

media_folder: img/uploads
public_folder: img/uploads

collections:
  - name: contenido
    label: Proyectos
    editor:
      preview: false
    files:
      - name: proyectos
        label: Lista de proyectos
        file: content/projects.json
        format: json
        fields:
          - name: projects
            label: Proyectos
            label_singular: proyecto
            widget: list
            summary: "{{fields.title}}"
            hint: "Arrastra los proyectos para cambiar el orden en la web. El primero es el que se ve primero."
            fields:
              - { name: published, label: "Visible en la web", widget: boolean, default: true,
                  hint: "Desactívalo para esconder el proyecto sin borrarlo." }
              - { name: title, label: "Título", widget: string }
              - { name: slug, label: "Dirección de la página", widget: string, required: false,
                  hint: "Solo minúsculas y guiones, p. ej. la-fermentacion. Si lo dejas vacío se crea a partir del título. No lo cambies después de compartir el enlace." }
              - name: type
                label: "Tipo"
                widget: select
                default: short
                options:
                  - { label: "Cortometraje", value: short }
                  - { label: "Largometraje", value: feature }
                  - { label: "Serie", value: series }
                  - { label: "Documental", value: documentary }
                  - { label: "Publicidad", value: commercial }
                  - { label: "Videoclip", value: videoclip }
              - { name: year, label: "Año", widget: string, required: false }
              - name: status
                label: "Estado"
                widget: select
                default: released
                options:
                  - { label: "Terminado", value: released }
                  - { label: "En desarrollo", value: development }
              - { name: image, label: "Imagen (fotograma)", widget: image, choose_url: false,
                  hint: "Horizontal, al menos 1600 px de ancho. JPG o WebP." }
              - { name: alt_es, label: "Descripción de la imagen (ES)", widget: string, required: false,
                  hint: "Para personas con lector de pantalla. Una frase corta." }
              - { name: alt_en, label: "Descripción de la imagen (EN)", widget: string, required: false }
              - { name: short_es, label: "Texto corto (ES)", widget: text,
                  hint: "Una frase. Aparece debajo de la imagen en la lista." }
              - { name: short_en, label: "Texto corto (EN)", widget: text, required: false }
              - { name: synopsis_es, label: "Sinopsis (ES)", widget: text, required: false,
                  hint: "Deja una línea en blanco entre párrafos." }
              - { name: synopsis_en, label: "Sinopsis (EN)", widget: text, required: false }
              - name: credits
                label: "Créditos"
                label_singular: "crédito"
                widget: list
                required: false
                summary: "{{fields.name}}"
                hint: "Una fila por persona o grupo."
                fields:
                  - name: role
                    label: "Rol"
                    widget: select
                    default: directora
                    options:
                      - { label: "Directora", value: directora }
                      - { label: "Director", value: director }
                      - { label: "Directoras", value: directoras }
                      - { label: "Directores", value: directores }
                      - { label: "Guionista", value: guionista }
                      - { label: "Guionistas", value: guionistas }
                      - { label: "Directora y guionista", value: directora-guionista }
                      - { label: "Director y guionista", value: director-guionista }
                      - { label: "Productora", value: productora }
                      - { label: "Productor", value: productor }
                      - { label: "Productoras", value: productoras }
                      - { label: "Productores", value: productores }
                      - { label: "Directora de fotografía", value: dop-f }
                      - { label: "Director de fotografía", value: dop-m }
                      - { label: "Otro (escríbelo abajo)", value: otro }
                  - { name: name, label: "Nombre", widget: string, hint: "Si son varias personas: Nadine Lifschitz y Gádor Camacho" }
                  - { name: role_es, label: "Otro rol (ES)", widget: string, required: false, hint: "Solo si en Rol has elegido Otro." }
                  - { name: role_en, label: "Otro rol (EN)", widget: string, required: false }
              - { name: genre_es, label: "Género (ES)", widget: string, required: false, hint: "p. ej. Terror" }
              - { name: genre_en, label: "Género (EN)", widget: string, required: false, hint: "p. ej. Horror" }
              - { name: stage_es, label: "Estado (ES)", widget: string, required: false, hint: "p. ej. Desarrollo y financiación. Aparece en la ficha del proyecto." }
              - { name: stage_en, label: "Estado (EN)", widget: string, required: false }
              - { name: duration, label: "Duración", widget: string, required: false, hint: "p. ej. 18 min" }
              - { name: festivals, label: "Festivales", widget: string, required: false,
                  hint: "Separados por comas." }
              - { name: trailer, label: "Enlace al tráiler", widget: string, required: false,
                  hint: "Enlace de Vimeo o YouTube. Si está vacío no aparece el botón." }

  - name: textos
    label: Textos de la web
    editor:
      preview: false
    files:
      - name: about
        label: About
        file: content/about.json
        format: json
        fields:
          - { name: title_es, label: "Título (ES)", widget: string }
          - { name: title_en, label: "Título (EN)", widget: string, required: false }
          - { name: body_es, label: "Texto (ES)", widget: text,
              hint: "Deja una línea en blanco entre párrafos. Pon **dos asteriscos** alrededor de una palabra para que salga en negrita." }
          - { name: body_en, label: "Texto (EN)", widget: text, required: false,
              hint: "Si lo dejas vacío, la versión inglesa muestra el texto en español." }
      - name: contact
        label: Contacto
        file: content/contact.json
        format: json
        fields:
          - { name: title_es, label: "Título (ES)", widget: string }
          - { name: title_en, label: "Título (EN)", widget: string, required: false }
          - { name: eyebrow_es, label: "Rótulo pequeño (ES)", widget: string, required: false, hint: "La palabra corta sobre el texto, p. ej. Hablemos. Vacío para quitarla." }
          - { name: eyebrow_en, label: "Rótulo pequeño (EN)", widget: string, required: false }
          - { name: lede_es, label: "Texto (ES)", widget: text }
          - { name: lede_en, label: "Texto (EN)", widget: text, required: false }
          - { name: email, label: "Email", widget: string }
          - { name: phone, label: "Teléfono", widget: string, required: false, hint: "Vacío para no mostrar teléfono." }
          - { name: city_es, label: "Ciudad (ES)", widget: string, required: false }
          - { name: city_en, label: "Ciudad (EN)", widget: string, required: false }
          - { name: instagram, label: "Enlace de Instagram", widget: string, required: false, hint: "Vacío para ocultar el icono." }
